name: Verification without training
on: [push, pull_request]
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[test,reference]'
      - run: python -m pytest -q
      - run: python -m train.main --config configs/M3.yaml --customers 20 --dry-run --set device=cpu training.batch_size=2
